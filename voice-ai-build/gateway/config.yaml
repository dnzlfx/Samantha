server:
  name: voice-gateway
  log_file: /logs/voice-gateway.log
  log_level: INFO

audio:
  sample_rate: 16000
  channels: 1
  frame_ms: 30
  input_device: 4
  output_device: 6
  output_sample_rate: 48000
  max_record_seconds: 12
  phrase_end_silence_ms: 900
  post_tts_mic_cooldown_ms: 700

wakeword:
  enabled: true
  provider: wyoming
  uri: tcp://voice-wakeword:10400
  name: hey_jarvis
  timeout_seconds: 30

vad:
  provider: webrtc
  aggressiveness: 2
  min_voice_ms: 450
  max_silence_ms: 900

stt:
  provider: wyoming
  uri: tcp://voice-whisper:10300
  timeout_seconds: 12
  min_text_chars: 3

tts:
  provider: wyoming
  uri: tcp://voice-piper:10200
  timeout_seconds: 10
  max_chars: 700

openclaw:
  enabled: true
  url: ws://openclaw:18790
  timeout_seconds: 35
  agent_default: main
  rpc_method: null

n8n:
  enabled: true
  base_url: http://n8n:5678
  voice_webhook_path: /webhook/voice-gateway-action
  timeout_seconds: 8
  token_env: VOICE_WEBHOOK_TOKEN

token_firewall:
  max_input_chars: 600
  max_followup_turns: 2
  followup_window_seconds: 8
  discard_single_words: true

local_actions:
  unsafe_admin_confirmation: CONFIRMO_REINICIAR_OPENCLAW
