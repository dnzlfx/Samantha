services:
  voice-piper:
    image: rhasspy/wyoming-piper:latest
    container_name: voice-piper
    restart: unless-stopped
    command:
      - --voice
      - es_ES-sharvard-medium
      - --uri
      - tcp://0.0.0.0:10200
    volumes:
      - /opt/voice-ai/piper:/data
    networks:
      - automation_internal
    ports:
      - "127.0.0.1:10200:10200"
    mem_limit: 768m
    cpus: "1.0"
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.create_connection(('127.0.0.1',10200),3); s.close()\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  voice-whisper:
    image: lscr.io/linuxserver/faster-whisper:latest
    container_name: voice-whisper
    restart: unless-stopped
    environment:
      - PUID=0
      - PGID=0
      - TZ=America/Mexico_City
      - WHISPER_MODEL=tiny-int8
      - WHISPER_LANG=es
      - WHISPER_BEAM=1
      - LOG_LEVEL=INFO
    volumes:
      - /opt/voice-ai/whisper:/config
    networks:
      - automation_internal
    ports:
      - "127.0.0.1:10300:10300"
    mem_limit: 2g
    cpus: "2.0"
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.create_connection(('127.0.0.1',10300),3); s.close()\""]
      interval: 30s
      timeout: 5s
      retries: 8
      start_period: 120s

  voice-wakeword:
    image: rhasspy/wyoming-openwakeword:latest
    container_name: voice-wakeword
    restart: unless-stopped
    command:
      - --uri
      - tcp://0.0.0.0:10400
      - --preload-model
      - hey_jarvis
    volumes:
      - /opt/voice-ai/openwakeword:/custom
    networks:
      - automation_internal
    ports:
      - "127.0.0.1:10400:10400"
    mem_limit: 512m
    cpus: "0.75"
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.create_connection(('127.0.0.1',10400),3); s.close()\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  automation_internal:
    external: true
    name: automatizacion_automation-internal
